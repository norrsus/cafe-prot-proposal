<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowState Hub · Find Your Focus</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#040a1c; --navy-900:#081330; --navy-800:#0d1c45; --navy-700:#14275f; --navy-600:#1d3680;
  --blue:#2f7bff; --blue-600:#1f63e0; --blue-100:#e4eeff; --sky:#8fb6ff;
  --wood:#b07a45; --wood-d:#6b4527; --cream:#f7f2ea;
  --surface:#f3f5f9; --white:#fff; --ink:#0c1530; --muted:#5d6985; --line:#e1e6f0;
  --green:#12905f; --green-bg:#dcf5ea; --amber:#a96a00; --amber-bg:#fdf0d2; --red:#c23a31; --red-bg:#fde4e1; --gray-bg:#e8ecf3;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgba(10,19,48,.06),0 2px 8px rgba(10,19,48,.05);
  --shadow:0 10px 30px -8px rgba(10,19,48,.18);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--white);line-height:1.55;-webkit-font-smoothing:antialiased;padding-top:var(--safe-top)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--ink)}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em;font-weight:600}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.72rem 1.25rem;border-radius:12px;font-weight:500;font-size:.92rem;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 18px -6px rgba(47,123,255,.7)}
.btn-primary:hover{background:var(--blue-600)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.28);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5)}
.btn-outline{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue-600)}
.btn-dark{background:var(--navy-900);color:#fff}.btn-dark:hover{background:var(--navy-700)}
.btn-danger{background:var(--red-bg);color:var(--red)}.btn-danger:hover{background:#f9cfca}
.btn-success{background:var(--green-bg);color:var(--green)}.btn-success:hover{background:#c4ecdb}
.btn-soft{background:var(--blue-100);color:var(--blue-600)}.btn-soft:hover{background:#d2e2ff}
.btn-sm{padding:.45rem .8rem;font-size:.8rem;border-radius:9px}
.btn-lg{padding:.95rem 1.6rem;font-size:1rem;border-radius:14px}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.btn-block{width:100%}
.ico{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Brand */
.brand{display:flex;align-items:center;gap:.7rem;font-weight:600;letter-spacing:-.02em;font-size:1.1rem}
.brand svg{width:38px;height:38px}
.brand small{display:block;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;opacity:.6;margin-top:-2px}

/* Public nav */
.nav{position:fixed;inset:var(--safe-top) 0 auto 0;z-index:50;transition:background .25s,box-shadow .25s;color:#fff}
.nav.solid{background:rgba(6,14,38,.92);backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.07)}
.nav-in{display:flex;align-items:center;gap:1.4rem;height:72px}
.nav-links{display:flex;gap:.2rem;margin-left:1.2rem}
.nav-links button{padding:.5rem .8rem;border-radius:9px;font-size:.88rem;opacity:.78;transition:.15s;color:#fff}
.nav-links button:hover,.nav-links button.on{opacity:1;background:rgba(255,255,255,.09)}
.nav-cta{margin-left:auto;display:flex;gap:.6rem;align-items:center}
.burger{display:none;margin-left:auto;padding:.5rem;border-radius:10px;color:#fff}
.burger .ico{width:26px;height:26px}
.mnav{display:none;position:fixed;inset:calc(72px + var(--safe-top)) 0 0 0;background:var(--navy-950);z-index:49;padding:1.2rem 20px;flex-direction:column;gap:.3rem;color:#fff;overflow:auto}
.mnav.open{display:flex}
.mnav button.l{text-align:left;padding:.95rem .6rem;border-bottom:1px solid rgba(255,255,255,.08);font-size:1.05rem}
.mnav .btn{margin-top:.8rem}

/* Hero */
.hero{background:radial-gradient(1000px 520px at 78% 38%,rgba(47,123,255,.2),transparent 70%),linear-gradient(180deg,var(--navy-950),var(--navy-900));color:#fff;padding:120px 0 0;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:3rem;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:500;margin-bottom:1.1rem}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--blue);border-radius:2px}
.hero h1{font-size:clamp(2.8rem,6.4vw,5.2rem);font-weight:700;letter-spacing:-.04em;line-height:.98}
.hero h1 em{font-style:normal;color:var(--sky)}
.hero p.lead{margin-top:1.4rem;font-size:1.1rem;color:#b9c5e6;max-width:520px;line-height:1.7}
.hero-ctas{display:flex;gap:.8rem;margin-top:2rem;flex-wrap:wrap}
.hero-art{position:relative;margin-bottom:-1px}
.hero-art .frame{border-radius:200px 28px 0 0;overflow:hidden;aspect-ratio:1/1.02;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
.hero-art .frame svg{width:100%;height:100%}
.float-card{position:absolute;left:-26px;bottom:60px;background:#fff;color:var(--ink);border-radius:16px;padding:.9rem 1.1rem;box-shadow:var(--shadow);display:flex;gap:.8rem;align-items:center;font-size:.82rem;animation:bob 6s ease-in-out infinite}
.float-card b{display:block;font-size:.95rem}
.float-card .dot{width:38px;height:38px;border-radius:11px;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
@keyframes bob{50%{transform:translateY(-7px)}}
.feat{background:var(--navy-800);border-top:1px solid rgba(255,255,255,.07)}
.feat-in{display:grid;grid-template-columns:repeat(4,1fr)}
.feat-item{display:flex;gap:.9rem;padding:1.5rem 1.2rem;color:#fff;align-items:flex-start;border-left:1px solid rgba(255,255,255,.07)}
.feat-item:first-child{border-left:0}
.feat-item .ic{width:42px;height:42px;border-radius:12px;background:rgba(47,123,255,.18);color:var(--sky);display:grid;place-items:center;flex:none}
.feat-item b{display:block;font-weight:500;font-size:.95rem}
.feat-item span{font-size:.8rem;color:#9eabce}

/* Sections */
section.s{padding:96px 0}
.s-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;margin-bottom:2.6rem;flex-wrap:wrap}
.s-head h2{font-size:clamp(1.9rem,3.6vw,2.8rem);max-width:640px}
.s-head p{color:var(--muted);max-width:430px}
.s-head .eyebrow{color:var(--blue-600)}
.s-dark{background:var(--navy-900);color:#fff}
.s-dark .s-head p{color:#9eabce}.s-dark .s-head .eyebrow{color:var(--sky)}
.s-cream{background:var(--cream)}
.space-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:1.3rem}
.space-card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.space-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.space-card .img{aspect-ratio:16/10;overflow:hidden;background:var(--navy-800)}
.space-card .img svg{width:100%;height:100%;transition:transform .5s}
.space-card:hover .img svg{transform:scale(1.04)}
.space-card .body{padding:1.3rem 1.4rem 1.5rem;display:flex;flex-direction:column;gap:.55rem;flex:1}
.space-card h3{font-size:1.15rem}
.space-card p{color:var(--muted);font-size:.9rem;flex:1}
.space-card .btn{align-self:flex-start;margin-top:.6rem}
.space-card:first-child{grid-row:span 2}
.space-card:first-child .img{aspect-ratio:auto;height:340px}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;align-items:stretch}
.price-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:1.6rem;display:flex;flex-direction:column;gap:.4rem;position:relative}
.price-card.feat-p{background:var(--blue);border-color:var(--blue);box-shadow:0 24px 50px -16px rgba(47,123,255,.7)}
.price-card h3{font-size:1rem;font-weight:500;color:#c9d4f2}
.price-card.feat-p h3{color:#e6efff}
.price-card .amt{font-size:2.5rem;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.price-card .amt small{font-size:.9rem;font-weight:400;opacity:.7;letter-spacing:0}
.price-card p{font-size:.85rem;color:#9eabce;margin-bottom:.8rem;flex:1}
.price-card.feat-p p{color:#dbe7ff}
.tag{position:absolute;top:-11px;right:18px;background:var(--wood);color:#fff;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .7rem;border-radius:99px;font-weight:600}
.notice{display:flex;gap:.7rem;align-items:flex-start;padding:.85rem 1.1rem;border-radius:12px;font-size:.84rem;background:var(--amber-bg);color:#6d4500;border:1px solid #f3dca0}
.notice .ico{margin-top:2px}
.notice.blue{background:var(--blue-100);color:#183c85;border-color:#c7dbff}
.notice.dark{background:rgba(255,255,255,.07);color:#cfd9f5;border-color:rgba(255,255,255,.14)}
.food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.food-card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.food-card .img{aspect-ratio:4/3;overflow:hidden}.food-card .img svg{width:100%;height:100%}
.food-card .body{padding:1rem 1.1rem 1.15rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.food-card h4{font-size:1rem;font-weight:500}
.food-card p{font-size:.8rem;color:var(--muted);flex:1}
.food-card .row{display:flex;align-items:center;justify-content:space-between;margin-top:.7rem}
.price{font-weight:600;font-size:1.05rem;color:var(--ink)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.about-art{border-radius:28px 160px 28px 28px;overflow:hidden;aspect-ratio:4/4.3;box-shadow:var(--shadow)}.about-art svg{width:100%;height:100%}
.about-grid h2{font-size:clamp(1.9rem,3.4vw,2.7rem);margin-bottom:1.1rem}
.about-grid p{color:#4a5675;margin-bottom:1rem}
.who{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1.5rem}
.who div{background:#fff;border-radius:14px;padding:.9rem 1rem;font-size:.88rem;font-weight:500;display:flex;gap:.6rem;align-items:center;box-shadow:var(--shadow-sm)}
.who .ico{color:var(--blue)}
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:3rem}
.contact-list{display:flex;flex-direction:column;gap:1.1rem;margin-top:1.6rem}
.contact-list div{display:flex;gap:.9rem;align-items:flex-start;color:#cdd7f2}
.contact-list .ic{width:42px;height:42px;border-radius:12px;background:rgba(47,123,255,.2);color:var(--sky);display:grid;place-items:center;flex:none}
.contact-list b{display:block;color:#fff;font-weight:500}
.contact-form{background:#fff;color:var(--ink);border-radius:22px;padding:1.8rem;display:grid;gap:1rem}
footer.foot{background:var(--navy-950);color:#9eabce;padding:56px 0 30px;font-size:.88rem}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
.foot h5{color:#fff;font-weight:500;margin-bottom:.9rem;font-size:.92rem}
.foot li{list-style:none;margin-bottom:.5rem}
.foot li button:hover,.foot a:hover{color:#fff}
.foot-bot{margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.8rem}

/* Forms */
.field{display:grid;gap:.4rem}
.field label{font-size:.8rem;font-weight:500;color:#33405f}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:.7rem .9rem;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,123,255,.15)}
.textarea{resize:vertical;min-height:96px}
.field .err{color:var(--red);font-size:.8rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* Portal */
.portal{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--navy-950)}
.portal-l{padding:2.2rem 3.5rem;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(700px 500px at 20% 90%,rgba(47,123,255,.22),transparent 70%),var(--navy-900);position:relative;overflow:hidden}
.portal-l h1{font-size:clamp(2rem,3.6vw,3.1rem);margin:2rem 0 1rem;letter-spacing:-.035em}
.portal-l p{color:#b4c1e3;max-width:420px}
.steps{display:grid;gap:1rem;margin-top:2rem}
.steps div{display:flex;gap:.9rem;align-items:flex-start;color:#cdd7f2;font-size:.92rem}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;background:rgba(47,123,255,.22);color:var(--sky);display:grid;place-items:center;font-weight:600;font-size:.82rem;flex:none}
.portal-r{background:var(--surface);display:grid;place-items:center;padding:2rem}
.portal-card{background:#fff;border-radius:26px;padding:2rem;width:min(430px,100%);box-shadow:var(--shadow)}
.qr-box{position:relative;border:1.5px dashed #c5d0e6;border-radius:20px;padding:1.2rem;width:fit-content;margin:1rem auto;background:#fff;cursor:pointer;transition:.2s}
.qr-box:hover{border-color:var(--blue);box-shadow:0 0 0 6px rgba(47,123,255,.08)}
.qr-box svg{width:190px;height:190px}
.qr-box .scan{position:absolute;left:12px;right:12px;top:14px;height:3px;background:var(--blue);box-shadow:0 0 18px 4px rgba(47,123,255,.6);border-radius:3px;opacity:0}
.qr-box.scanning .scan{opacity:1;animation:scan 1.1s ease-in-out}
@keyframes scan{from{top:14px}to{top:calc(100% - 17px)}}
.qr-cap{text-align:center;font-size:.78rem;color:var(--muted)}
.or{display:flex;align-items:center;gap:.8rem;color:var(--muted);font-size:.78rem;margin:1.1rem 0}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}

/* App shell */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:var(--surface)}
.side{background:var(--navy-900);color:#fff;padding:1.4rem 1rem;display:flex;flex-direction:column;gap:1.4rem;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 .5rem}
.side nav{display:flex;flex-direction:column;gap:.2rem}
.side nav button{display:flex;gap:.75rem;align-items:center;padding:.7rem .85rem;border-radius:11px;font-size:.9rem;color:#b9c5e6;text-align:left;transition:.15s;position:relative}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(47,123,255,.8)}
.side nav .cnt{margin-left:auto;background:var(--wood);color:#fff;font-size:.68rem;padding:.08rem .45rem;border-radius:99px;font-weight:600}
.side .push{margin-top:auto;display:grid;gap:.5rem}
.mini{background:rgba(255,255,255,.06);border-radius:14px;padding:.9rem;font-size:.78rem;color:#b9c5e6}
.mini b{display:block;color:#fff;font-size:.95rem;font-weight:500}
.side .lnk{font-size:.82rem;color:#9eabce;padding:.5rem .85rem;border-radius:9px;display:flex;gap:.6rem;align-items:center;text-align:left}
.side .lnk:hover{color:#fff;background:rgba(255,255,255,.06)}
.staff-tag{display:inline-block;background:var(--wood);color:#fff;font-size:.62rem;letter-spacing:.1em;padding:.15rem .5rem;border-radius:6px;font-weight:600;margin-left:.3rem;vertical-align:middle}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:1rem;padding:1rem 2rem;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h2{font-size:1.2rem;font-weight:600}
.top .crumb{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--muted)}
.top .crumb button:hover{color:var(--blue-600)}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:.7rem}
.avatar{width:38px;height:38px;border-radius:12px 12px 12px 4px;background:var(--wood);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.85rem}
.cartbtn{position:relative;padding:.55rem;border-radius:11px;border:1.5px solid var(--line)}
.cartbtn .n{position:absolute;top:-7px;right:-7px;background:var(--blue);color:#fff;font-size:.66rem;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;font-weight:600}
.demo-banner{background:var(--navy-800);color:#c6d3f5;font-size:.76rem;padding:.45rem 2rem;display:flex;gap:.5rem;align-items:center}
.demo-banner b{color:#fff;font-weight:500}
.page{padding:1.8rem 2rem 3rem;display:grid;gap:1.5rem;align-content:start;max-width:1280px;width:100%}
.mbar{display:none}
.card{background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:1.4rem}
.card h3{font-size:1.05rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.card h3 .link{font-size:.8rem;font-weight:500;color:var(--blue-600)}
.welcome{background:radial-gradient(500px 240px at 100% 0,rgba(47,123,255,.4),transparent 70%),linear-gradient(120deg,var(--navy-800),var(--navy-900));color:#fff;border-radius:22px 22px 22px 6px;padding:1.8rem 2rem;display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;align-items:center}
.welcome h2{font-size:clamp(1.5rem,3vw,2.1rem)}
.welcome p{color:#b4c1e3;margin-top:.4rem;max-width:480px;font-size:.93rem}
.cd{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.03em}
.welcome .cdbox{text-align:right}
.welcome .cdbox .cd{font-size:2.6rem;line-height:1}
.welcome .cdbox span{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:#9eb3e6}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:1.5rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.4rem}
.kv div>span:not(.badge){display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kv div b{font-weight:600;font-size:1rem}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:.9rem}
.qa{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.1rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;font-size:.86rem;font-weight:500;transition:.2s;box-shadow:var(--shadow-sm)}
.qa .ic{width:46px;height:46px;border-radius:13px;background:var(--blue-100);color:var(--blue-600);display:grid;place-items:center;transition:.2s}
.qa:hover{transform:translateY(-3px);border-color:var(--blue)}
.qa:hover .ic{background:var(--blue);color:#fff}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.22rem .65rem;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)}.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-100);color:var(--blue-600)}.b-gray{background:var(--gray-bg);color:#4a5675}.b-red{background:var(--red-bg);color:var(--red)}
.list{display:grid;gap:.7rem}
.li{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.85rem 1rem;border:1px solid var(--line);border-radius:13px;background:#fff}

/* ---------- Demo QR (illustration only; not a scannable code) ---------- */
function qrSvg(seedStr='FLOWSTATE-DEMO'){
  const N=25; let h=2166136261; for(const c of seedStr){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%1000)/1000};
  const m=Array.from({length:N},()=>Array.from({length:N},()=>rnd()>.54));
  const finder=(r,c)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const edge=i==0||j==0||i==6||j==6,core=i>=2&&i<=4&&j>=2&&j<=4;m[r+i][c+j]=edge||core}for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const rr=r+i,cc=c+j;if(rr>=0&&cc>=0&&rr<N&&cc<N&&(i<0||j<0||i>6||j>6))m[rr][cc]=false}};
  finder(0,0);finder(0,N-7);finder(N-7,0);
  let r='';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(m[i][j])r+=`<rect x="${j}" y="${i}" width="1.02" height="1.02"/>`;
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" fill="#081330" shape-rendering="crispEdges" aria-label="Demonstration QR code illustration"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${r}<rect x="9.5" y="9.5" width="6" height="6" rx="1.4" fill="#fff"/><rect x="10.3" y="10.3" width="4.4" height="4.4" rx="1" fill="#2f7bff"/></svg>`;
}

  return `<div class="portal"><div class="portal-l"><div><button data-act="go" data-to="/" style="color:#fff">${brand()}</button><h1>Staff Demo</h1><p>See how the team receives orders, equipment requests and assistance calls in real time.</p></div>
    <button class="btn btn-ghost btn-sm" style="align-self:flex-start" data-act="go" data-to="/">${ic('back')} Back to website</button></div>
    <div class="portal-r"><div class="portal-card"><div class="notice" style="margin-bottom:1.2rem">${ic('shield')}<span><b>Prototype only.</b> This is a demonstration login with no real authentication and is not production security.</span></div>
    <h2 style="font-size:1.5rem;margin-bottom:1rem">Staff sign-in</h2>
    <form data-form="staff" style="display:grid;gap:.9rem"><div class="field"><label>Demo PIN</label><input class="input" name="pin" autocomplete="off" placeholder="STAFF2026" data-keep="pin"><span class="err" id="pin-err"></span></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button></form>
    <button class="btn btn-soft btn-block" style="margin-top:.7rem" data-act="staffDemo">${ic('zap')} Enter Staff Demo</button>
    <button class="btn btn-outline btn-block" style="margin-top:.7rem" data-act="go" data-to="/portal">${ic('qr')} Go to Customer Portal</button></div></div></div>`;
}
/* ---------- Shared components ---------- */
const tracker = st => { const i = ORDER_FLOW.indexOf(st); return `<div class="tracker" aria-label="Order status: ${st}">${ORDER_FLOW.map((x, n) => `<div class="st ${n <= i ? 'done' : ''} ${n === i ? 'cur' : ''}">${x}</div>`).join('')}</div>`; };
const emptyState = (icon, t, d, btn = '') => `<div class="empty">${ic(icon)}<b>${t}</b>${d}${btn ? `<div style="margin-top:.9rem">${btn}</div>` : ''}</div>`;
const itemsText = o => o.items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ');
const staffAlerts = () => { const c = staffCounts(); return c.pending + c.open + c.lreq + c.breq; };

function dock(mode) {
  const n = staffAlerts();
  return `<div class="dock" role="toolbar" aria-label="Demo switcher">
    <button class="${mode === 'cust' ? 'on' : ''}" data-act="go" data-to="/app">${ic('user')}<span class="t">Customer</span></button>
    <button class="${mode === 'staff' ? 'on' : ''}" data-act="go" data-to="/staff">${ic('users')}<span class="t">Staff</span>${n ? `<span class="n">${n}</span>` : ''}</button>
    <span class="sep"></span><button data-act="resetAsk" title="Reset demo data">${ic('refresh')}<span class="t">Reset</span></button></div>`;
}

/* ---------- Customer shell ---------- */
const CNAV = [['dash', 'home', 'Dashboard', '/app'], ['order', 'coffee', 'Order Food', '/app/order'], ['space', 'grid', 'Workspace & Equipment', '/app/space'], ['help', 'help', 'Assistance', '/app/help'], ['orders', 'list', 'My Orders', '/app/orders'], ['session', 'clock', 'My Session', '/app/session']];
function appShell(key, title, inner) {
  const s = me(); const act = myOrders().filter(o => o.status !== 'Completed').length;
  const nav = CNAV.map(([k, i, l, to]) => `<button class="${k === key ? 'on' : ''}" data-act="go" data-to="${to}">${ic(i)}${l}${k === 'orders' && act ? `<span class="cnt">${act}</span>` : ''}</button>`).join('');
  const mbar = CNAV.filter(x => x[0] !== 'session').map(([k, i, l, to]) => `<button class="${k === key ? 'on' : ''}" data-act="go" data-to="${to}">${ic(i)}${l.split(' ')[0] === 'Workspace' ? 'Space' : l.replace('Assistance', 'Help').replace('Order Food', 'Order').replace('My Orders', 'Orders')}${k === 'orders' && act ? `<span class="n">${act}</span>` : ''}</button>`).join('');
  return `<div class="shell"><aside class="side"><div>${brand()}</div><nav aria-label="Customer">${nav}</nav>
    <div class="push"><div class="mini"><span>Active session</span><b>Seat ${esc(s.seat)}</b><span>Ends ${fmtTime(s.end)} · <span class="cd" data-end="${s.end}">${fmtCd(s.end - Date.now())}</span></span></div>
    <button class="lnk" data-act="go" data-to="/">${ic('home')} Back to website</button><button class="lnk" data-act="go" data-to="/staff">${ic('users')} Staff Demo</button><button class="lnk" data-act="exitPortal">${ic('logout')} Exit portal</button></div></aside>
    <div class="main"><div class="top"><div class="mbrand">${logoMark(32)}</div><div><div class="crumb"><button data-act="go" data-to="/">Home</button>/<button data-act="go" data-to="/app">Customer Portal</button>${key !== 'dash' ? `/<span>${title}</span>` : ''}</div><h2>${title}</h2></div>
      <div class="sp">${key !== 'dash' ? `<button class="btn btn-outline btn-sm" data-act="go" data-to="/app">${ic('back')} Dashboard</button>` : ''}<button class="cartbtn" data-act="openCart" aria-label="Cart, ${cartCount()} items">${ic('cart')}${cartCount() ? `<span class="n">${cartCount()}</span>` : ''}</button><div class="avatar" title="${esc(s.name)}">AR</div></div></div>
      <div class="demo-banner">${ic('shield')}<span><b>Demonstration mode.</b> Sample data only. No real payments or personal data.</span></div>
      <div class="page">${inner}</div></div></div><nav class="mbar" aria-label="Mobile">${mbar}</nav>${dock('cust')}`;
}

/* ---------- Customer: dashboard ---------- */
function viewDash() {
  const s = me(), os = myOrders().slice(0, 3);
  const activeOrders = myOrders().filter(o => o.status !== 'Completed').length;
  const qa = [['coffee', 'Order Food', 'go', '/app/order'], ['grid', 'View Workspace', 'go', '/app/space'], ['help', 'Request Assistance', 'assistModal', ''], ['list', 'My Orders', 'go', '/app/orders'], ['clock', 'My Session', 'go', '/app/session']]
    .map(q => `<button class="qa" data-act="${q[2]}" data-to="${q[3]}"><span class="ic">${ic(q[0])}</span>${q[1]}</button>`).join('');
  const body = `<div class="welcome"><div><h2>${greeting()}, ${esc(s.short)}!</h2><p>You're settled in at seat <b>${esc(s.seat)}</b> with ${activeOrders ? `<b>${activeOrders} active order${activeOrders > 1 ? 's' : ''}</b>` : 'no active orders'}. ${s.laptop ? `Laptop <b>${s.laptop}</b> is assigned to you.` : 'You are using your own device.'}</p></div>
      <div class="cdbox"><span>Time remaining</span><div class="cd" data-end="${s.end}">${fmtCd(s.end - Date.now())}</div></div></div>
    <div class="quick">${qa}</div>
    <div class="grid2"><div class="card"><h3>Active Session <button class="link" data-act="go" data-to="/app/session">Details →</button></h3>
      <div class="kv"><div><span>Status</span>${badge('Active')}</div><div><span>Assigned seat</span><b>${esc(s.seat)}</b></div>
      <div><span>Assigned laptop</span><b>${s.laptop ? s.laptop : 'Own device'}</b></div><div><span>Session start</span><b>${fmtTime(s.start)}</b></div>
      <div><span>Session end</span><b>${fmtTime(s.end)}</b></div><div><span>Remaining</span><b class="cd" data-end="${s.end}">${fmtCd(s.end - Date.now())}</b></div></div>
      ${!s.laptop ? `<div class="notice blue" style="margin-top:1.1rem">${ic('laptop')}<span>Need a laptop? Request one from the café inventory.&nbsp;<button style="font-weight:600;text-decoration:underline" data-act="go" data-to="/app/space">Browse laptops</button></span></div>` : ''}</div>
    <div class="card"><h3>Current Orders <button class="link" data-act="go" data-to="/app/orders">View all →</button></h3>
      ${os.length ? `<div class="list">${os.map(o => `<div class="li"><div><div class="t">${o.id} · ${peso(o.total)}</div><div class="s">${itemsText(o)}</div></div>${badge(o.status)}</div>`).join('')}</div>` : emptyState('coffee', 'No orders yet', 'Order something to fuel your session.', `<button class="btn btn-primary btn-sm" data-act="go" data-to="/app/order">Order Food</button>`)}</div></div>`;
  return appShell('dash', 'Dashboard', body);
}

/* ---------- Customer: ordering ---------- */
function cartPanel() {
  const s = me(), n = cartCount(), tot = cartTotal();
  const items = S.cart.map(i => `<div class="cart-item"><div class="nm">${esc(i.name)}<div style="font-size:.75rem;color:var(--muted);font-weight:400">${peso(i.price)} each</div></div><div class="pr">${peso(i.price * i.qty)}</div>
    <div class="qty"><button data-act="dec" data-id="${i.id}" aria-label="Decrease">${ic('minus')}</button><b>${i.qty}</b><button data-act="inc" data-id="${i.id}" aria-label="Increase">${ic('plus')}</button></div><div style="text-align:right"><button class="rm" data-act="rm" data-id="${i.id}" aria-label="Remove ${esc(i.name)}">${ic('trash')}</button></div></div>`).join('');
  return `<div class="cart" id="cart"><div class="card"><h3>Your Cart <span class="badge b-blue">${n} item${n === 1 ? '' : 's'}</span></h3>
    ${n ? items : emptyState('cart', 'Your cart is empty', 'Add something tasty from the menu.')}
    <div style="margin-top:.8rem"><div class="sumrow"><span>Subtotal</span><span>${peso(tot)}</span></div><div class="sumrow"><span>Seat service</span><span>Free</span></div><div class="sumrow tot"><span>Total</span><span>${peso(tot)}</span></div></div></div>
    <form class="card" data-form="checkout" style="display:grid;gap:.9rem"><h3 style="margin:0">Checkout</h3>
      <div class="notice">${ic('alert')}<span><b>Demonstration order.</b> No payment is taken.</span></div>
      <div class="field"><label>Customer</label><input class="input" value="${esc(s.name)} · Session ${s.id}" disabled></div>
      <div class="field"><label>Deliver to</label><select class="select" name="seat" data-keep="seat"><option value="${esc(s.seat)}">Seat ${esc(s.seat)} (your seat)</option><option value="Counter pickup">Counter pickup</option></select></div>
      <div class="field"><label>Order notes <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea class="textarea" name="notes" style="min-height:70px" placeholder="e.g. no onions, less ice" data-keep="notes"></textarea></div>
      <button class="btn btn-primary btn-lg btn-block ${n ? '' : 'disabled'}" type="submit">Place Order · ${peso(tot)}</button></form></div>`;
}
function viewOrder() {
  if (UI.confirmOrder) {
    const o = S.orders.find(x => x.id === UI.confirmOrder);
    if (o) return appShell('order', 'Order Confirmed', `<div class="card confirm"><div class="big">${ic('check')}</div><h2>Order placed!</h2><p style="color:var(--muted);margin:.4rem 0 1rem">Your demonstration order was sent to the café team.</p>
      <div class="onum">${o.id}</div><div style="margin:.3rem 0 1rem;color:var(--muted);font-size:.9rem">Deliver to ${esc(o.seat)} · ${peso(o.total)}</div>${tracker(o.status)}
      <div style="text-align:left;margin:1.4rem 0;display:grid;gap:.4rem">${o.items.map(i => `<div class="sumrow"><span>${i.qty}× ${esc(i.name)}</span><span>${peso(i.qty * i.price)}</span></div>`).join('')}<div class="sumrow tot"><span>Total</span><span>${peso(o.total)}</span></div></div>
      <div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-act="go" data-to="/app/orders">View My Orders</button><button class="btn btn-outline" data-act="orderMore">Order more</button></div></div>`);
  }
  const items = MENU.filter(m => UI.cat === 'All Items' || m.cat === UI.cat);
  const card = m => { const c = S.cart.find(i => i.id === m.id); return `<div class="food-card"><div class="img">${foodArt(m.art)}</div><div class="body"><h4>${m.name}</h4><p>${m.desc}</p><div class="row"><span class="price">${peso(m.price)}</span><button class="btn btn-primary btn-sm" data-act="add" data-id="${m.id}">${ic('plus')} Add to Cart${c ? ` (${c.qty})` : ''}</button></div></div></div>`; };
  const tabs = MENU_CATS.map(c => `<button class="tab ${UI.cat === c ? 'on' : ''}" data-act="cat" data-k="${c}">${c}</button>`).join('');
  return appShell('order', 'Order Food', `<div class="order-grid"><div style="display:grid;gap:1.2rem"><div class="tabs">${tabs}</div><div class="menu-grid">${items.map(card).join('')}</div></div>${cartPanel()}</div>
    <button class="btn btn-primary floatcart" data-act="toCart">${ic('cart')} Cart · ${peso(cartTotal())}</button>`);
}

/* ---------- Customer: my orders ---------- */
function viewOrders() {
  const all = myOrders(), t = UI.ordersTab;
  const list = all.filter(o => t === 'all' || (t === 'active' ? o.status !== 'Completed' : o.status === 'Completed'));
  const cnt = k => all.filter(o => k === 'all' || (k === 'active' ? o.status !== 'Completed' : o.status === 'Completed')).length;
  const tabs = [['active', 'Active'], ['completed', 'Completed'], ['all', 'All']].map(([k, l]) => `<button class="tab ${t === k ? 'on' : ''}" data-act="ordersTab" data-k="${k}">${l}<span class="n">${cnt(k)}</span></button>`).join('');
  return appShell('orders', 'My Orders', `<div class="tabs">${tabs}</div>
    ${list.length ? `<div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${list.map(o => `<div class="card ocard ${UI.flash === o.id ? 'newflash' : ''}"><div class="hd"><b>${o.id}</b>${badge(o.status)}</div><div class="items">${itemsText(o)}</div>${o.notes ? `<div style="font-size:.8rem;color:var(--muted)">Note: ${esc(o.notes)}</div>` : ''}<div style="display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)"><span>${esc(o.seat)} · ${fmtAgo(o.at)}</span><b style="color:var(--ink)">${peso(o.total)}</b></div>${tracker(o.status)}</div>`).join('')}</div>`
      : emptyState('list', t === 'completed' ? 'No completed orders yet' : 'No active orders', 'Orders you place will appear here with live status.', `<button class="btn btn-primary btn-sm" data-act="go" data-to="/app/order">Order Food</button>`)}`);
}

/* ---------- Customer: workspace & equipment ---------- */
function viewSpace() {
  const s = me(), f = UI.wsFilter;
  const pendingLap = S.laptopReqs.find(r => r.sid === s.id && r.status === 'Pending');
  const fl = [['All', 'All'], ['OW', 'Open Workspace'], ['QD', 'Quiet Study Desk'], ['GS', 'Group Study Area']].map(([k, l]) => `<button class="tab ${f === k ? 'on' : ''}" data-act="wsFilter" data-k="${k}">${l}</button>`).join('');
  const ws = S.spaces.filter(w => f === 'All' || w.type === f).map(w => {
    const mine = w.id === s.seat, ok = w.status === 'Available';
    return `<div class="sp-card ${mine ? 'mine' : ''}"><div class="meta"><span>${WS_TYPES[w.type]}</span>${mine ? badge('Active') : badge(w.status)}</div><div class="id">${w.id}</div><div class="meta"><span>${peso(WS_PRICE[w.type])}/hour <em style="font-size:.7rem">(illustrative)</em></span></div>
      ${mine ? `<button class="btn btn-soft btn-sm disabled" disabled>Your current seat</button>` : ok ? `<button class="btn btn-primary btn-sm" data-act="bookModal" data-id="${w.id}">Request Booking</button>` : `<button class="btn btn-outline btn-sm" disabled>Not available</button>`}</div>`;
  }).join('');
  const lap = S.laptops.map(l => {
    const mine = s.laptop === l.id, ok = l.status === 'Available';
    return `<div class="card lap-card ${ok || mine ? '' : 'off'}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="lap-ico">${ic('laptop')}</span>${mine ? badge('Assigned') : badge(l.status)}</div><div style="font-size:1.4rem;font-weight:700;letter-spacing:-.03em">${l.id}</div><div style="font-size:.82rem;color:var(--muted)">${l.model}${l.status === 'Under Maintenance' ? ' · ' + esc(l.note || 'Maintenance') : ''}</div>
      ${mine ? `<span class="btn btn-soft btn-sm disabled">Assigned to you</span>` : ok ? `<button class="btn btn-primary btn-sm" data-act="lapModal" data-id="${l.id}">Request Laptop</button>` : `<button class="btn btn-outline btn-sm" disabled>${l.status === 'Assigned' ? 'Currently assigned' : 'Unavailable'}</button>`}</div>`;
  }).join('');
  const reqs = [...S.laptopReqs.filter(r => r.sid === s.id).map(r => ({ ...r, kind: 'Laptop ' + r.target })), ...S.bookingReqs.filter(r => r.sid === s.id).map(r => ({ ...r, kind: 'Booking ' + r.target }))].sort((a, b) => b.at - a.at);
  return appShell('space', 'Workspace & Equipment', `<div class="notice blue">${ic('laptop')}<span><b>Bringing your own device?</b> You're all set, no rental needed. Rent a café laptop only if you need one.</span></div>
    <div><h3 style="margin-bottom:1rem;font-size:1.2rem">Workspaces</h3><div class="tabs" style="margin-bottom:1rem">${fl}</div><div class="sp-grid">${ws}</div></div>
    <div><h3 style="margin-bottom:.3rem;font-size:1.2rem">Laptop inventory</h3><p style="color:var(--muted);font-size:.85rem;margin-bottom:1rem">${s.laptop ? `You currently have ${s.laptop}.` : pendingLap ? `Your request for ${pendingLap.target} is waiting for staff approval.` : 'Request an available laptop and staff will bring it to your seat.'}</p><div class="sp-grid">${lap}</div></div>
    <div class="card"><h3>My Requests</h3>${reqs.length ? `<div class="list">${reqs.map(r => `<div class="li"><div><div class="t">${r.kind}</div><div class="s">${r.hours ? r.hours + ' hr · ' : ''}${peso(r.cost)} est. · ${fmtAgo(r.at)}</div></div>${badge(r.status)}</div>`).join('')}</div>` : emptyState('clock', 'No requests yet', 'Booking and laptop requests will show up here.')}</div>`);
}

/* ---------- Customer: assistance ---------- */
function viewHelp() {
  const last = UI.lastAssist && S.assists.find(a => a.id === UI.lastAssist);
  const cats = ASSIST_CATS.map(c => `<button type="button" class="cat ${UI.helpCat === c.k ? 'on' : ''}" data-act="helpCat" data-k="${c.k}">${ic(c.i)}${c.k}</button>`).join('');
  const hist = myAssists();
  return appShell('help', 'Assistance', `<div class="helphero"><h1>Need a Hand? We've Got You.</h1><p>Stay at your seat. Tell us what you need and a team member will come over quietly.</p></div>
    ${last ? `<div class="card" style="border-color:#bfe8d5;background:#f3fbf7;display:flex;gap:1rem;align-items:center"><span style="width:44px;height:44px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex:none">${ic('check')}</span><div><b>Request submitted · ${last.id}</b><div style="font-size:.88rem;color:#44516f">${esc(last.cat)}. Our team has been notified. Status: ${last.status}.</div></div></div>` : ''}
    <div class="grid2"><form class="card" data-form="assist" style="display:grid;gap:1.1rem"><h3 style="margin:0">New request</h3><div class="cat-grid">${cats}</div><span class="err" id="cat-err" style="color:var(--red);font-size:.8rem"></span>
      <div class="field"><label>Short description</label><textarea class="textarea" name="desc" placeholder="Tell us what's going on…" data-keep="desc"></textarea></div><button class="btn btn-primary" type="submit">Submit Request</button></form>
    <div class="card"><h3>My request history</h3>${hist.length ? `<div class="list">${hist.map(a => `<div class="li ${UI.lastAssist === a.id ? 'newflash' : ''}"><div><div class="t">${a.id}</div><div class="s">${esc(a.cat)} · ${fmtAgo(a.at)}</div><div class="s" style="color:#44516f;margin-top:.15rem">${esc(a.desc)}</div></div>${badge(a.status)}</div>`).join('')}</div>` : emptyState('help', 'No requests yet', 'Anything you submit shows here.')}</div></div>`);
}

/* ---------- Customer: session ---------- */
function viewSession() {
  const s = me(), total = s.end - s.start, C = 2 * Math.PI * 88;
  return appShell('session', 'My Session', `<div class="grid2"><div class="card" style="text-align:center"><h3 style="justify-content:center">Time remaining</h3>
    <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#e8ecf3" stroke-width="12"/><circle id="ringc" data-start="${s.start}" data-end="${s.end}" cx="100" cy="100" r="88" fill="none" stroke="#2f7bff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.max(0, s.end - Date.now()) / total)}"/></svg><div class="c"><div class="cd" data-end="${s.end}">${fmtCd(s.end - Date.now())}</div><span>remaining</span></div></div>
    <div style="margin-top:1.4rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-act="extend">${ic('clock')} Request 1-hour extension</button></div></div>
    <div class="card"><h3>Session details</h3><div class="kv"><div><span>Session ID</span><b>${s.id}</b></div><div><span>Status</span>${badge(s.status)}</div><div><span>Seat</span><b>${esc(s.seat)}</b></div><div><span>Seat type</span><b>${WS_TYPES[spaceType(s.seat)]}</b></div><div><span>Laptop</span><b>${s.laptop || 'Own device'}</b></div><div><span>Customer</span><b>${esc(s.name)}</b></div><div><span>Start</span><b>${fmtTime(s.start)}</b></div><div><span>End</span><b>${fmtTime(s.end)}</b></div></div>
    <div class="notice blue" style="margin-top:1.2rem">${ic('shield')}<span>Demonstration session. In a real deployment, access would be tied to a staff-issued QR.</span></div>
    <div style="margin-top:1rem;display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn btn-outline btn-sm" data-act="go" data-to="/app/space">${ic('laptop')} ${s.laptop ? 'Equipment' : 'Request laptop'}</button><button class="btn btn-outline btn-sm" data-act="assistModal">${ic('help')} Get help</button></div></div></div>`);
}

function viewEnded() {
  return `<div class="portal"><div class="portal-l"><div>${brand()}<h1>Your session has ended.</h1><p>Thanks for working with us. Your seat and equipment access were closed by the café team.</p></div></div>
  <div class="portal-r"><div class="portal-card" style="text-align:center"><div class="confirm" style="padding:0"><div class="big" style="background:var(--gray-bg);color:#4a5675">${ic('clock')}</div></div><h2 style="font-size:1.4rem">Access revoked</h2><p style="color:var(--muted);margin:.4rem 0 1.2rem;font-size:.9rem">This is the demonstration of session end. Staff can restart the session from the Staff Demo.</p>
  <div style="display:grid;gap:.6rem"><button class="btn btn-primary" data-act="go" data-to="/staff/sessions">${ic('users')} Open Staff Demo</button><button class="btn btn-outline" data-act="go" data-to="/">Back to website</button></div></div></div></div>`;
}

/* ================= STAFF ================= */
const SNAV = [['overview', 'chart', 'Overview', '/staff'], ['orders', 'coffee', 'Food Orders', '/staff/orders'], ['equipment', 'laptop', 'Equipment & Spaces', '/staff/equipment'], ['assist', 'help', 'Assistance', '/staff/assist'], ['sessions', 'users', 'Sessions', '/staff/sessions']];
function staffShell(key, title, inner) {

function render() {

    html = v[0](); title = 'Staff · ' + v[1] + ' · FlowState Hub';

  document.title = title || 'FlowState Hub';
  app.innerHTML = html;
  Object.entries(keep).forEach(([k, v]) => { const e = document.querySelector(`[data-keep="${k}"]`); if (e && v !== undefined) e.value = v; });
  if (akey) { const e = document.querySelector(`[data-keep="${akey}"]`); if (e) { e.focus(); try { e.setSelectionRange(selS, selE); } catch (x) {} } }
  if (p !== lastPath) { window.scrollTo(0, 0); lastPath = p; }
  else window.scrollTo(0, y);

/* ---------- Toasts & modals ---------- */
function toast(msg, type = 'info') {
  const t = document.createElement('div'); t.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
  t.setAttribute('role', 'status'); t.innerHTML = `<span style="flex:1">${msg}</span>`;
  const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove();
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3600);
}
function modal(html, wide = false) {
  $('#modal').innerHTML = `<div class="ov"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#modal input:not([disabled]),#modal select,#modal textarea'); if (f) setTimeout(() => f.focus(), 50);
}
const closeModal = () => { $('#modal').innerHTML = ''; };

/* ---------- Notifications for status changes ---------- */
function notifyCustomerChanges() {
  const s = me(); S.seen = S.seen || {}; let dirty = false;
  const chk = (key, status, msg) => { const prev = S.seen[key]; if (prev !== undefined && prev !== status) setTimeout(() => toast(msg, 'ok'), 150); if (prev !== status) { S.seen[key] = status; dirty = true; } };
  myOrders().forEach(o => chk('o:' + o.id, o.status, `Order <b>${o.id}</b> is now <b>${o.status}</b>`));
  myAssists().forEach(a => chk('a:' + a.id, a.status, `Request <b>${a.id}</b> is now <b>${a.status}</b>`));
  S.laptopReqs.filter(r => r.sid === s.id).forEach(r => chk('l:' + r.id, r.status, `Laptop request for <b>${r.target}</b> was <b>${r.status.toLowerCase()}</b>`));
  S.bookingReqs.filter(r => r.sid === s.id).forEach(r => chk('b:' + r.id, r.status, `Booking request for <b>${r.target}</b> was <b>${r.status.toLowerCase()}</b>`));
  if (dirty) save();
}

  toCart() { scrollCart(); },
  cat(el) { UI.cat = el.dataset.k; render(); },
  orderMore() { UI.confirmOrder = null; render(); },
  ordersTab(el) { UI.ordersTab = el.dataset.k; render(); },
  wsFilter(el) { UI.wsFilter = el.dataset.k; render(); },
  helpCat(el) { UI.helpCat = el.dataset.k; render(); },
  extend() { const id = createAssist('Other Request', 'Please extend my session by 1 hour.'); toast(`Extension request sent · <b>${id}</b>`, 'ok'); },
  assistModal() {
    modal(`${mHead('Request assistance')}<form class="mb" data-form="assistModal"><div class="field"><label>What do you need help with?</label><select class="select" name="cat">${ASSIST_CATS.map(c => `<option>${c.k}</option>`).join('')}</select></div><div class="field"><label>Short description</label><textarea class="textarea" name="desc" placeholder="Tell us what's going on…" required></textarea></div><button class="btn btn-primary" type="submit">Submit Request</button></form>`);
  },
  bookModal(el) {
    const w = S.spaces.find(x => x.id === el.dataset.id), opts = durOptions(w.type);
    modal(`${mHead('Request booking · ' + w.id)}<form class="mb" data-form="book" data-id="${w.id}"><div class="notice blue">${ic('alert')}<span>Demonstration request. Staff will approve it from the Staff Demo. Prices are illustrative.</span></div>
      <div class="kv"><div><span>Workspace</span><b>${w.id}</b></div><div><span>Type</span><b>${WS_TYPES[w.type]}</b></div></div>
      <div class="field"><label>Duration</label><select class="select" name="dur" id="durSel">${opts.map(o => `<option value="${o.k}" data-cost="${o.cost}">${o.label} · ${peso(o.cost)}</option>`).join('')}</select></div>
      <div class="field"><label>Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input class="input" name="note" placeholder="e.g. need a seat near the window"></div>
      <button class="btn btn-primary" type="submit">Send Booking Request</button></form>`);
  },
  lapModal(el) {
    const l = S.laptops.find(x => x.id === el.dataset.id);
    modal(`${mHead('Request laptop · ' + l.id)}<form class="mb" data-form="laptop" data-id="${l.id}"><div class="kv"><div><span>Device</span><b>${l.id}</b></div><div><span>Model</span><b>${l.model}</b></div></div>
      <div class="field"><label>Rental duration</label><select class="select" name="hours">${[1, 2, 3, 4].map(h => `<option value="${h}">${h} hour${h > 1 ? 's' : ''} · ${peso(30 * h)}</option>`).join('')}</select></div>
      <div class="field"><label>Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input class="input" name="note" placeholder="e.g. need Excel installed"></div>
      <div class="notice">${ic('alert')}<span>Illustrative ₱30/hour add-on. Demo only, no payment taken.</span></div><button class="btn btn-primary" type="submit">Send Laptop Request</button></form>`);
  },
  /* staff */
  sOrderFilter(el) { UI.sOrderFilter = el.dataset.k; render(); },
  sAssistFilter(el) { UI.sAssistFilter = el.dataset.k; render(); },
  orderNext(el) {
    let o; commit(s => { o = s.orders.find(x => x.id === el.dataset.id); o.status = nextStatus(o.status); });
    toast(`${o.id} → <b>${o.status}</b>`, 'ok');
  },
  assistSet(el) { let a; commit(s => { a = s.assists.find(x => x.id === el.dataset.id); a.status = el.dataset.st; }); toast(`${a.id} → <b>${a.status}</b>`, 'ok'); },
  lapSet(el) {
    const id = el.dataset.id, st = el.dataset.st;
    commit(s => { const l = s.laptops.find(x => x.id === id); releaseLaptop(l); l.status = st; if (st === 'Assigned') l.by = 'walkin'; l.note = st === 'Under Maintenance' ? 'Under maintenance' : undefined; });
    toast(`${id} marked <b>${st}</b>`, 'ok');
  },
  lapReq(el) {
    const r = S.laptopReqs.find(x => x.id === el.dataset.id), ok = el.dataset.ok === '1';
    if (ok) {
      const l = S.laptops.find(x => x.id === r.target), sess = sessionById(r.sid);
      if (!l || l.status !== 'Available') return toast(`${r.target} is no longer available. Reject this request or free a laptop first.`, 'err');
      if (!sess || sess.status !== 'Active') return toast('That customer session is no longer active.', 'err');
      commit(s => { const L = s.laptops.find(x => x.id === r.target), q = s.laptopReqs.find(x => x.id === r.id); L.status = 'Assigned'; L.by = r.sid; q.status = 'Approved'; sessionById(r.sid).laptop = r.target; s.laptopReqs.forEach(o => { if (o.id !== q.id && o.target === q.target && o.status === 'Pending') o.status = 'Rejected'; }); });
      toast(`<b>${r.target}</b> assigned to ${esc(r.customer)}`, 'ok');
    } else { commit(s => { s.laptopReqs.find(x => x.id === r.id).status = 'Rejected'; }); toast('Laptop request rejected'); }
  },
  bookReq(el) {
    const r = S.bookingReqs.find(x => x.id === el.dataset.id), ok = el.dataset.ok === '1';
    if (ok) {
      const w = S.spaces.find(x => x.id === r.target);
      if (!w || w.status !== 'Available') return toast(`${r.target} is no longer available.`, 'err');
      commit(s => { s.bookingReqs.find(x => x.id === r.id).status = 'Approved'; s.spaces.find(x => x.id === r.target).status = 'Reserved'; s.bookingReqs.forEach(o => { if (o.id !== r.id && o.target === r.target && o.status === 'Pending') o.status = 'Rejected'; }); });
      toast(`<b>${r.target}</b> reserved for ${esc(r.customer)}`, 'ok');
    } else { commit(s => { s.bookingReqs.find(x => x.id === r.id).status = 'Rejected'; }); toast('Booking request rejected'); }
  },
  endAsk(el) {
    const s = sessionById(el.dataset.id);
    confirmModal({ title: `End session for ${esc(s.short)}?`, body: `Access will be revoked and seat <b>${esc(s.seat)}</b> will be freed.${s.demo ? ' The customer view will show that the session has ended.' : ''}`, label: 'End Session', act: 'endDo', id: s.id,
      extra: s.laptop ? `<label class="chk"><input type="checkbox" id="retchk" checked> Laptop <b>${s.laptop}</b> has been returned</label>` : '' });
  },
  endDo(el) {
    const returned = !$('#retchk') || $('#retchk').checked; const id = el.dataset.id; let note = '';
    closeModal();
    commit(s => {
      const x = sessionById(id); x.status = 'Ended'; setSpace(x.seat, 'Available');
      if (x.laptop) { const l = s.laptops.find(q => q.id === x.laptop); if (returned) { l.status = 'Available'; l.by = null; x.laptop = null; note = ' Laptop is available again.'; } else note = ` ${x.laptop} stays assigned until returned.`; }
    });
    toast(`Session ended.${note}`, 'ok');
  },
  restartSession(el) { closeModal(); commit(s => { const x = sessionById(el.dataset.id); const now = Date.now(); x.status = 'Active'; x.start = now; x.end = now + SESSION_MS; setSpace(x.seat, 'Occupied'); }); toast('Session restarted. Customer access restored.', 'ok'); },
  startModal() {
    const free = S.spaces.filter(w => w.status === 'Available'), laps = S.laptops.filter(l => l.status === 'Available');
    modal(`${mHead('Start new session')}<form class="mb" data-form="startSession"><div class="field"><label>Customer name</label><input class="input" name="name" required placeholder="e.g. Sam Cruz" autocomplete="off"></div>
      <div class="row2"><div class="field"><label>Seat</label><select class="select" name="seat">${free.map(w => `<option value="${w.id}">${w.id} · ${WS_TYPES[w.type]}</option>`).join('') || '<option value="">No seats free</option>'}</select></div>
      <div class="field"><label>Duration</label><select class="select" name="hours">${[1, 2, 3, 4].map(h => `<option value="${h}">${h} hour${h > 1 ? 's' : ''}</option>`).join('')}</select></div></div>
      <div class="field"><label>Laptop</label><select class="select" name="laptop"><option value="">Own device</option>${laps.map(l => `<option value="${l.id}">${l.id} · ${l.model}</option>`).join('')}</select></div>
      <button class="btn btn-primary" type="submit">Start Session</button></form>`);
  },
  resetAsk() { confirmModal({ title: 'Reset demo data?', body: 'All orders, requests and sessions return to their starting state, and you will be returned to the landing page.', label: 'Reset Demo', act: 'resetDo' }); },
  resetDo() { closeModal(); resetDemo(); Object.assign(UI, { cat: 'All Items', ordersTab: 'active', wsFilter: 'All', confirmOrder: null, helpCat: null, lastAssist: null, sOrderFilter: 'All', sAssistFilter: 'All', flash: null }); location.hash = '#/'; render(); toast('Demo data reset', 'ok'); },
};

function enterPortal() {
  const s = me();
  if (s.status !== 'Active') { toast('This session has ended. Restart it from the Staff Demo, or reset demo data.', 'err'); render(); return; }
  S.access = true; save(); toast(`Welcome, ${esc(s.short)}! Demo session active.`, 'ok'); location.hash = '#/app';
}

/* ---------- Forms ---------- */
const FORM = {
  contact(f) { toast('Message sent (demo only). Thank you!', 'ok'); f.reset(); },
  access(f) {
    const v = f.code.value.trim().toUpperCase(), err = $('#code-err');
    if (v !== DEMO_CODE) { err.textContent = 'That code was not recognised. For the demo, use DEMO2026.'; f.code.focus(); return; }
    enterPortal();
  },
  staff(f) { const v = f.pin.value.trim().toUpperCase(); if (v !== 'STAFF2026') { $('#pin-err').textContent = 'Demo PIN is STAFF2026, or use the Enter Staff Demo button.'; return; } ACT.staffDemo(); },
  checkout(f) {
    if (!S.cart.length) return toast('Your cart is empty. Add an item first.', 'err');
    const s = me(); let id;
    commit(st => {
      id = 'FH-' + (st.orderSeq++); const items = st.cart.map(i => ({ ...i }));
      st.orders.push({ id, sid: s.id, customer: s.short + ' ' + s.name.split(' ')[1][0] + '.', seat: f.seat.value, items, total: items.reduce((n, i) => n + i.qty * i.price, 0), status: 'Pending', notes: f.notes.value.trim(), at: Date.now() });
      st.cart = []; UI.confirmOrder = id; UI.flash = id;
      st.seen = st.seen || {}; st.seen['o:' + id] = 'Pending';
    });
    toast(`Order <b>${id}</b> placed`, 'ok');
  },
  assist(f) {
    if (!UI.helpCat) { $('#cat-err').textContent = 'Please choose a category.'; return; }
    if (f.desc.value.trim().length < 3) { toast('Please add a short description.', 'err'); f.desc.focus(); return; }
    const cat = UI.helpCat, desc = f.desc.value.trim(); f.desc.value = ''; UI.helpCat = null;
    const id = createAssist(cat, desc); toast(`Request submitted · <b>${id}</b>`, 'ok');
  },
  assistModal(f) { const id = createAssist(f.cat.value, f.desc.value.trim()); closeModal(); toast(`Request submitted · <b>${id}</b>`, 'ok'); if (path() !== 'app/help') { UI.lastAssist = id; } },
  book(f) {
    const s = me(), w = S.spaces.find(x => x.id === f.dataset.id);
    if (!w || w.status !== 'Available') return toast('That workspace is no longer available.', 'err');
    if (S.bookingReqs.some(r => r.sid === s.id && r.target === w.id && r.status === 'Pending')) return toast('You already requested this workspace.', 'err');
    const o = durOptions(w.type).find(x => x.k === f.dur.value);
    commit(st => { st.bookingReqs.push({ id: 'BK-' + nextId(), sid: s.id, customer: s.short + ' ' + s.name.split(' ')[1][0] + '.', seat: s.seat, target: w.id, hours: o.hours, cost: o.cost, note: f.note.value.trim(), status: 'Pending', at: Date.now() }); });
    closeModal(); toast(`Booking request sent for <b>${w.id}</b>. Waiting for staff.`, 'ok');
  },
  laptop(f) {
    const s = me(), l = S.laptops.find(x => x.id === f.dataset.id);
    if (l.status !== 'Available') return toast(`${l.id} is ${l.status.toLowerCase()} and cannot be requested.`, 'err');
    if (s.laptop) return toast(`You already have laptop ${s.laptop}.`, 'err');
    if (S.laptopReqs.some(r => r.sid === s.id && r.status === 'Pending')) return toast('You already have a pending laptop request.', 'err');
    const h = +f.hours.value;
    commit(st => { st.laptopReqs.push({ id: 'LR-' + nextId(), sid: s.id, customer: s.short + ' ' + s.name.split(' ')[1][0] + '.', seat: s.seat, target: l.id, hours: h, cost: 30 * h, note: f.note.value.trim(), status: 'Pending', at: Date.now() }); });
    closeModal(); toast(`Laptop request sent for <b>${l.id}</b>. Waiting for staff.`, 'ok');
  },
  startSession(f) {
    if (!f.seat.value) return toast('No seats are free right now.', 'err');
    const name = f.name.value.trim(), h = +f.hours.value, now = Date.now(), lap = f.laptop.value;
    commit(s => {
      const id = 'S-' + (1001 + s.sessions.length);
      s.sessions.push({ id, name, short: name.split(' ')[0], seat: f.seat.value, laptop: lap || null, start: now, end: now + h * 3600000, status: 'Active' });
      setSpace(f.seat.value, 'Occupied'); if (lap) { const l = s.laptops.find(x => x.id === lap); l.status = 'Assigned'; l.by = id; }
    });
    closeModal(); toast(`Session started for <b>${esc(name)}</b>`, 'ok');
  },
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('ov')) return closeModal();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f && FORM[f.dataset.form]) { e.preventDefault(); FORM[f.dataset.form](f); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act) { e.preventDefault(); ACT[e.target.dataset.act](e.target); }
});
document.addEventListener('change', e => { /* reserved for future filters */ });
window.addEventListener('hashchange', () => { UI.navOpen = false; render(); });
window.addEventListener('scroll', navScroll, { passive: true });
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  const prev = S; try { S = JSON.parse(e.newValue); } catch (x) { return; }
  if (path().startsWith('staff')) {
    const fresh = (a, b) => b.filter(x => !a.some(y => y.id === x.id));
    fresh(prev.orders, S.orders).forEach(o => toast(`New order <b>${o.id}</b> from ${esc(o.customer)} (${esc(o.seat)})`, 'ok'));
    fresh(prev.assists, S.assists).forEach(a => toast(`New assistance request <b>${a.id}</b>`, 'ok'));
    fresh(prev.laptopReqs, S.laptopReqs).forEach(r => toast(`New laptop request for <b>${r.target}</b>`, 'ok'));
    fresh(prev.bookingReqs, S.bookingReqs).forEach(r => toast(`New booking request for <b>${r.target}</b>`, 'ok'));
  }
  render();
});

/* Live countdowns without re-rendering */
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-end]').forEach(e => { if (e.id !== 'ringc') e.textContent = fmtCd(+e.dataset.end - now); });
  const r = document.getElementById('ringc');
  if (r) { const tot = +r.dataset.end - +r.dataset.start, C = 2 * Math.PI * 88; r.setAttribute('stroke-dashoffset', C * (1 - Math.max(0, Math.min(1, (+r.dataset.end - now) / tot)))); }
}
setInterval(tick, 1000);
render();
</script></body></html>
